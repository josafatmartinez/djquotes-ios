name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/DJQuotesDomain
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test

  ios-build:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: >-
          xcodebuild -project DJQuotes.xcodeproj -scheme DJQuotes
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
